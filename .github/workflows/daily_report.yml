name: Daily Portfolio Tracker

on:
  schedule:
    - cron: '55 22 * * 1-5'
  workflow_dispatch:

  concurrency:
    group: portfolio-tracker-run
    cancel-in-progress: true  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Chinese Fonts for Matplotlib
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk
        rm -rf ~/.cache/matplotlib

    - name: Run Tracker and Send Email
      env:
        GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 這裡新增
      run: python portfolio_tracker.py

    - name: Commit SQLite DB changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add portfolio_history.db trend_chart.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update portfolio history [skip ci]" && git push)