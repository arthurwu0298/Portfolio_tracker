name: Daily Portfolio Tracker

on:
  schedule:
    # 台灣時間 17:30 (UTC 09:30)，週一到週五執行
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tracker and Send Email
      env:
        GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: python portfolio_tracker.py

    - name: Commit SQLite DB changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add portfolio_history.db history_chart.png
        # 若資料庫與圖表有更新則 commit 回 repo，達成免伺服器資料庫儲存
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update portfolio history [skip ci]" && git push)
